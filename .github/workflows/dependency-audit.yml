name: Production Dependency Audit
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit committed production dependencies
        run: |
          npm ci --ignore-scripts --no-audit
          npm audit --omit=dev --json > "$RUNNER_TEMP/edge-audit.json" || true
          node -e 'const a=require(process.argv[1]); if(!a.vulnerabilities || !a.metadata || typeof a.metadata.vulnerabilities.total!=="number") throw Error("Audit response unavailable"); for(const [name,v] of Object.entries(a.vulnerabilities)) console.log(JSON.stringify({name,severity:v.severity,range:v.range,nodes:v.nodes,via:v.via,fixAvailable:v.fixAvailable})); console.log(JSON.stringify(a.metadata.vulnerabilities)); if(a.metadata.vulnerabilities.total>0) process.exitCode=1;' "$RUNNER_TEMP/edge-audit.json"
