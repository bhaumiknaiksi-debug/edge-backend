name: EDGE Trade Snapshot Live Smoke
on:
  pull_request:
    paths:
      - ".github/workflows/trade-snapshot-live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe feature gate, owner protection, and evidence-health mode
        shell: bash
        run: |
          set -euo pipefail
          base='https://edge-backend-r1ng.onrender.com'
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 80 "$base/api/v1/trade-snapshots/status" > /tmp/snapshot.json
          node -e "const d=require('/tmp/snapshot.json');if(d.enabled!==true||d.readOnly!==true)throw Error('Snapshot capture not enabled in production'); console.log('Snapshot feature enabled; order automation disabled')"
          code=$(curl --silent --show-error --max-time 30 --output /tmp/unauthorized.json --write-out '%{http_code}' "$base/api/v1/trade-snapshots")
          test "$code" = "401" || { echo "Snapshot GET must require owner authentication; got $code"; exit 1; }
          code=$(curl --silent --show-error --max-time 30 --output /tmp/unauthorized-post.json --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{}' "$base/api/v1/trade-snapshots")
          test "$code" = "401" || { echo "Snapshot POST must require owner authentication; got $code"; exit 1; }
          curl --fail --silent --show-error --retry 2 --max-time 80 "$base/api/v1/market/status" > /tmp/market.json
          node -e "const d=require('/tmp/market.json'); if(!d.serverTime||!['OPEN','CLOSED','PRE_OPEN'].includes(d.phase)) throw Error('Market status response invalid');console.log('Market status healthy',d.phase)"
          curl --fail --silent --show-error --retry 2 --max-time 80 "$base/evidence/status" > /tmp/evidence.json
          node -e "const d=require('/tmp/evidence.json');if(d.collectionMode!=='LIGHTWEIGHT'||d.storage?.provider!=='POSTGRES')throw Error('Lightweight evidence not active or storage unavailable');console.log('Evidence mode:',d.collectionMode,'in-memory records:',d.total)"
          curl --fail --silent --show-error --retry 2 --max-time 80 "$base/evidence/health" > /tmp/health.json
          node scripts/check-evidence-health.js health /tmp/health.json
          node -e "const d=require('/tmp/health.json');if(d.collectionMode!=='LIGHTWEIGHT')throw Error('Health reporter not sampling-aware');console.log('Evidence health:',d.healthy,'issues:',d.issues)"
          echo "SAFE LIVE SMOKE PASSED: public status + owner locks + market health; no authenticated writes performed."
